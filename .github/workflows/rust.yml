name: TriadOS validation
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
  live-build-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Rust-owned distribution configuration
        run: |
          test -f src/packages.rs
          test -f config/package-lists/triados.list.chroot
          test -f config/archives/triados-security.list.chroot
          test -f config/archives/triados-security.list.binary
          test -f .gitattributes
          test ! -e auto/config
          test ! -e scripts/build-iso.sh
          test ! -e config/hooks/live/0100-triados-enable-services.hook.chroot
          grep -q 'trixie' src/packages.rs
          grep -q 'sway' config/package-lists/triados.list.chroot
          grep -q 'trixie-security' config/archives/triados-security.list.chroot
  build-iso:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install live-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin mtools dosfstools
      - run: cargo build --release
      - name: Build ISO through Rust
        run: sudo target/release/triad image
      - uses: actions/upload-artifact@v4
        with:
          name: triados-live-amd64
          path: |
            live-image-amd64.hybrid.iso
            live-image-amd64.hybrid.iso.sha256
          if-no-files-found: error
          retention-days: 14
