name: Rust CI
on:
  push:
    branches: [main, rust-rewrite]
  pull_request:
    branches: [main, rust-rewrite]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
