[package]
name = "triados"
version = "0.5.0"
edition = "2021"
description = "TriadOS Rust system manager and service foundation"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "sync"] }

[[bin]]
name = "triad"
path = "src/main.rs"
