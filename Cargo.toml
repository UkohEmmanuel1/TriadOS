[package]
name = "triados"
version = "0.4.0"
edition = "2021"
description = "TriadOS Rust system manager and service foundation"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[[bin]]
name = "triad"
path = "src/main.rs"
