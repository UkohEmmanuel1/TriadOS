[package]
name = "triados"
version = "0.6.1"
edition = "2021"
description = "TriadOS Rust system manager and distribution builder"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "sync", "time"] }

[[bin]]
name = "triad"
path = "src/main.rs"
